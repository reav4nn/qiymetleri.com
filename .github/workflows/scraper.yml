name: Scheduled Scraper

on:
  schedule:
    # Run every day at 03:00 UTC (07:00 Baku time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      spider:
        description: "Spider to run (leave empty for all)"
        required: false
        default: ""

jobs:
  scrape:
    name: Run Scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies + Playwright
        working-directory: scraper
        run: |
          poetry install --no-interaction
          poetry run playwright install chromium --with-deps

      - name: Copy shared module
        run: cp -r shared scraper/

      - name: Run all spiders
        if: ${{ github.event.inputs.spider == '' }}
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SCRAPER_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL || secrets.SCRAPER_REDIS_URL || '' }}
          PROXY_ENABLED: ${{ secrets.PROXY_ENABLED || 'false' }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME || '' }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD || '' }}
        run: |
          for spider in ispace irshad_electronics baku_electronics kontakt_home; do
            echo "=========================================="
            echo "=== Running Spider: $spider ==="
            echo "=========================================="
            poetry run scrapy crawl "$spider" || echo "Warning: $spider completed with warnings or errors, continuing..."
          done

      - name: Run specific spider
        if: ${{ github.event.inputs.spider != '' }}
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SCRAPER_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL || secrets.SCRAPER_REDIS_URL || '' }}
          PROXY_ENABLED: ${{ secrets.PROXY_ENABLED || 'false' }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME || '' }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD || '' }}
          SPIDER_NAME: ${{ github.event.inputs.spider }}
        run: |
          case "$SPIDER_NAME" in
            ispace|irshad_electronics|baku_electronics|kontakt_home) ;;
            *) echo "Unknown spider: $SPIDER_NAME"; exit 1 ;;
          esac
          poetry run scrapy crawl "$SPIDER_NAME"
