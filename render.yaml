databases:
  - name: qiymetleri-db
    databaseName: qiymetleri
    user: qiymetleri
    plan: free

services:
  # FastAPI backend (Web Service - Free Plan)
  - type: web
    name: qiymetleri-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qiymetleri-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CACHE_REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123

  # Celery worker (scraper task queue)
